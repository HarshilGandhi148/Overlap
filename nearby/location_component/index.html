<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#1f423a}button{padding:11px 16px;background:#15715f;color:white;border:0;border-radius:8px;font:600 14px system-ui;cursor:pointer}p{font-size:13px;margin:8px 0}
</style></head><body><button id="locate">Use my location</button><p id="status">Your browser will ask permission. Your location stays in this outing.</p><script>
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:90});
document.getElementById('locate').onclick=()=>{
 const status=document.getElementById('status');
 if(!navigator.geolocation){status.textContent='Location is unavailable. Enter coordinates below.';return}
 status.textContent='Finding your location…';
 navigator.geolocation.getCurrentPosition(p=>{status.textContent='Location received.';send('streamlit:setComponentValue',{value:{latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy},dataType:'json'})},
 ()=>{status.textContent='Could not get your location. Allow access or enter coordinates below.';send('streamlit:setComponentValue',{value:{error:true},dataType:'json'})},
 {enableHighAccuracy:false,timeout:10000,maximumAge:0});
};
</script></body></html>
